<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Explain. Reason. Critique.</title>
  <desc id="d">The Asia causal network from the benchmark, with the deliberately reversed edge from Lung Cancer to Smoking highlighted in amber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#14203d"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #5eead4; font-size: 17px; font-weight: 600; letter-spacing: 3px; }
    .head { fill: #f8fafc; font-size: 62px; font-weight: 800; letter-spacing: -1.5px; }
    .head.alt { fill: #fbbf24; }
    .sub { fill: #a8b5d1; font-size: 20px; }
    .edge { stroke: #5eead4; stroke-opacity: .7; stroke-width: 2; }
    .flaw { stroke: #fbbf24; stroke-width: 3; stroke-dasharray: 9 7; animation: flow 1.1s linear infinite; }
    .node rect { fill: #111a33; stroke: #34466f; stroke-width: 1.5; }
    .node text { fill: #dbe4f5; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .hot rect { fill: #2a2210; stroke: #fbbf24; animation: pulse 2.2s ease-in-out infinite; }
    .hot text { fill: #fde68a; }
    .tag { fill: #fbbf24; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes pulse { 50% { stroke-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .flaw, .hot rect { animation: none; } }
  </style>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#dots)"/>
  <ellipse cx="945" cy="200" rx="360" ry="220" fill="url(#glow)"/>
  <text class="eyebrow" x="64" y="82">CAUSAL AI  ×  LLMS</text>
  <text class="head" x="64" y="158">Explain.</text>
  <text class="head" x="64" y="228">Reason.</text>
  <text class="head alt" x="64" y="298">Critique.</text>
  <text class="sub" x="64" y="346">6 LLMs · 12 causal graphs · 1 independent judge</text>
  <line class="edge" x1="720.0" y1="112.0" x2="720.0" y2="172.0" marker-end="url(#a)"/><line class="flaw" x1="1032.0" y1="84.0" x2="1098.0" y2="84.0" marker-end="url(#af)"/><line class="edge" x1="1170.0" y1="112.0" x2="1170.0" y2="172.0" marker-end="url(#a)"/><line class="edge" x1="792.0" y1="200.0" x2="833.0" y2="200.0" marker-end="url(#a)"/><line class="edge" x1="946.7" y1="112.0" x2="918.3" y2="172.0" marker-end="url(#a)"/><line class="edge" x1="883.3" y1="228.0" x2="836.7" y2="288.0" marker-end="url(#a)"/><line class="edge" x1="940.0" y1="228.0" x2="1015.0" y2="288.0" marker-end="url(#a)"/><line class="edge" x1="1141.0" y1="228.0" x2="1079.0" y2="288.0" marker-end="url(#a)"/>
  <g class="node"><rect x="654.0" y="62.0" width="132" height="44" rx="12"/><text x="720" y="90">Visit to Asia</text></g><g class="node hot"><rect x="894.0" y="62.0" width="132" height="44" rx="12"/><text x="960" y="90">Lung Cancer</text></g><g class="node hot"><rect x="1104.0" y="62.0" width="132" height="44" rx="12"/><text x="1170" y="90">Smoking</text></g><g class="node"><rect x="654.0" y="178.0" width="132" height="44" rx="12"/><text x="720" y="206">Tuberculosis</text></g><g class="node"><rect x="839.0" y="178.0" width="132" height="44" rx="12"/><text x="905" y="206">TB or Cancer</text></g><g class="node"><rect x="1104.0" y="178.0" width="132" height="44" rx="12"/><text x="1170" y="206">Bronchitis</text></g><g class="node"><rect x="749.0" y="294.0" width="132" height="44" rx="12"/><text x="815" y="322">X-Ray Result</text></g><g class="node"><rect x="984.0" y="294.0" width="132" height="44" rx="12"/><text x="1050" y="322">Dyspnoea</text></g>
  <text class="tag" x="1065" y="46">REVERSED EDGE</text>
</svg>
